[project]
name = "mcpserver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vedant", email = "vkowdiki@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.11",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1,<2",
]

[project.scripts]
mcpserver = "mcpserver:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.17.4",
]
